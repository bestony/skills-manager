name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GPUI's Linux backend needs these system libraries at build time:
      # wayland (wayland-sys), xkbcommon + xcb (xkbcommon/xcb crates),
      # fontconfig + freetype (text system), vulkan headers (wgpu renderer).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            build-essential \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxcb-xfixes0-dev \
            libxcb-xkb-dev \
            libfontconfig-dev \
            libfreetype-dev \
            libvulkan-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --verbose
